  <title>BMI</title>

<body>
<script>
  name = window.prompt("請輸入您的姓名")
  height = window.prompt("請輸入您的身高，單位是公尺")
  weight = window.prompt("請輸入您的體重，單位是公斤")

  bmi = weight / (height * height)

  str = name +"的身高："+ height + name +"的體重："+ weight
  console.iog(str)

  alert("name +"您好，您的bmi是"+ bmi)
</script>
